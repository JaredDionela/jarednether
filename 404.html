<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #1D1D1D;
      --bg-card: #262626;
      --text-primary: #EBE8E1;
      --accent-muted: #918B7E;
      --border-rest: rgba(145, 139, 126, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, var(--accent-muted) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.04;
      pointer-events: none;
    }

    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--border-rest);
      border-radius: 12px;
      padding: 48px;
      text-align: center;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 72px;
      font-weight: 700;
      color: var(--accent-muted);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 12px;
    }

    .error-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 15px;
      color: var(--accent-muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .error-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent-muted);
      margin-bottom: 24px;
      opacity: 0.6;
    }

    .error-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      background: var(--text-primary);
      color: var(--bg-main);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .error-link:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-message">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <p class="error-mono">// ERROR_NOT_FOUND</p>
    <a href="index.html" class="error-link">← Go back home</a>
  </div>
</body>
</html>
